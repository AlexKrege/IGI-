{% extends 'base.html' %}
{% block content %}
<h1>Удаление заявки</h1>
<p>Вы уверены, что хотите удалить заявку?</p>
<p><strong>Тип:</strong> {{ object.property_type.name|default:"Любой" }}</p>
<p><strong>Бюджет:</strong> {{ object.budget }} руб.</p>
<p><strong>Статус:</strong> {{ object.get_status_display }}</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Да, удалить</button>
    <a href="{% url 'properties:application_detail' object.pk %}">Отмена</a>
</form>
{% endblock %}
