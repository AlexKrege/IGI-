{% extends 'base.html' %}
{% block content %}
<h1>Новости</h1>
{% for news in news_list %}
    <div class="news-item">
        {% if news.image %}
            <img src="{{ news.image.url }}" alt="{{ news.title }}" style="max-width: 300px; border-radius: 8px;">
        {% endif %}
        <h2>{{ news.title }}</h2>
        <p>{{ news.summary }}</p>
        <a href="{% url 'agency:news_detail' news.id %}">Читать далее →</a>
    </div>
{% empty %}
    <p>Новостей пока нет.</p>
{% endfor %}
{% endblock %}
