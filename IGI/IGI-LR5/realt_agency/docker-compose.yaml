version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: realty_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - ./media:/app/media
      - ./logs:/app/logs
volumes:
  postgres_data: